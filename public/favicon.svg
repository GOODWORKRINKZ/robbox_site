<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="роббокс.тех">
  <title>роббокс.тех</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171236"/>
      <stop offset="1" stop-color="#07070F"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D8FF"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6EE7F9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#7C5CFF" stroke-opacity="0.45" stroke-width="12"/>

  <!--
    Лицо из знака: две зеркальные б под общим козырьком. Штрих утолщён,
    а вписанная окружность убрана: она касается квадрата, и на 16 px
    они слипаются в пятно. Объектив целиком живёт в полном знаке.
  -->
  <g transform="translate(-409,390.6) scale(2.04)">
    <g fill="none" stroke="url(#ink)" stroke-width="22" stroke-linecap="round" stroke-linejoin="miter">
      <g transform="translate(322,0) scale(-1,1)">
        <rect x="7" y="-87" width="80" height="80"/>
        <path d="M87 -132 L7 -132 L7 -87"/>
      </g>
      <g transform="translate(330,0)">
        <rect x="7" y="-87" width="80" height="80"/>
        <path d="M87 -132 L7 -132 L7 -87"/>
      </g>
    </g>
    <circle cx="275" cy="-47" r="14" fill="url(#ink)"/>
    <circle cx="377" cy="-47" r="14" fill="url(#ink)"/>
  </g>
</svg>
