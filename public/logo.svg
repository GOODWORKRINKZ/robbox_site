<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -146 1130 201" width="1130" height="201" role="img" aria-label="роббокс.тех">
  <title>роббокс.тех</title>
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="-140" x2="1045" y2="50">
      <stop offset="0" stop-color="#E9D8FF"/>
      <stop offset="0.5" stop-color="#B49CFF"/>
      <stop offset="1" stop-color="#8B7BFF"/>
    </linearGradient>

    <!--
      Все буквы собраны из одной окружности r=40: о — целая, р — плюс стойка,
      с и к — её дуга, е — плюс перекладина, б — она же, вписанная в квадрат
      со стороной в её диаметр.
    -->
    <g id="skeleton" fill="none">
      <!-- р -->
      <g transform="translate(0,0)">
        <path d="M7 -87 L7 40"/>
        <circle cx="47" cy="-47" r="40"/>
      </g>
      <!-- о -->
      <g transform="translate(114,0)"><circle cx="47" cy="-47" r="40"/></g>
      <!-- б зеркальная: стойка к центру, перекладина наружу -->
      <g transform="translate(322,0) scale(-1,1)">
        <rect x="7" y="-87" width="80" height="80"/>
        <path d="M87 -132 L7 -132 L7 -87"/>
        <circle cx="47" cy="-47" r="40"/>
      </g>
      <!-- б -->
      <g transform="translate(330,0)">
        <rect x="7" y="-87" width="80" height="80"/>
        <path d="M87 -132 L7 -132 L7 -87"/>
        <circle cx="47" cy="-47" r="40"/>
      </g>
      <!-- о -->
      <g transform="translate(444,0)"><circle cx="47" cy="-47" r="40"/></g>
      <!-- к: стойка и отодвинутая дуга с -->
      <g transform="translate(558,0)">
        <path d="M7 -87 L7 -7"/>
        <path d="M86.7 -77.6 A40 40 0 1 0 86.7 -16.4"/>
      </g>
      <!-- с -->
      <g transform="translate(672,0)"><path d="M72.7 -77.6 A40 40 0 1 0 72.7 -16.4"/></g>
      <!-- . -->
      <g transform="translate(766,0)"><path d="M7 -7 L7 -7"/></g>
      <!-- т -->
      <g transform="translate(796,0)">
        <path d="M7 -87 L87 -87"/>
        <path d="M47 -87 L47 -7"/>
      </g>
      <!-- е -->
      <g transform="translate(910,0)">
        <path d="M87 -47 A40 40 0 1 0 72.7 -16.4"/>
        <path d="M7 -47 L87 -47"/>
      </g>
      <!-- х -->
      <g transform="translate(1024,0)">
        <path d="M7 -87 L79 -7"/>
        <path d="M79 -87 L7 -7"/>
      </g>
    </g>

    <!-- штрих 14 минус его сердцевина 7.6 = контур 3.2 с каждой стороны -->
    <mask id="tube">
      <g stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="miter"><use href="#skeleton"/></g>
      <g stroke="#000" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="miter"><use href="#skeleton"/></g>
      <circle class="pupil" cx="275" cy="-47" r="9" fill="#fff"/>
      <circle class="pupil" cx="377" cy="-47" r="9" fill="#fff"/>
    </mask>

    <style>
      .pupil { transform-box: fill-box; transform-origin: center; animation: blink 5.8s infinite; }
      @keyframes blink { 0%,88%,100% { transform: scaleY(1); } 91%,93% { transform: scaleY(0.12); } }
      @media (prefers-reduced-motion: reduce) { .pupil { animation: none; } }
    </style>
  </defs>

  <rect x="-10" y="-146" width="1130" height="201" fill="url(#ink)" mask="url(#tube)"/>
</svg>
